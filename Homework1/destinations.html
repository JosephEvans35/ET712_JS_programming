<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Travel Explorer</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid px-4">

            <a class="navbar-brand" href="index.html">
                🌎 Travel Explorer
            </a>

            <div class="navbar-nav ms-auto">
                <a class="nav-link active" href="index.html">Home</a>
                <a class="nav-link" href="destinations.html">Destinations</a>
                <a class="nav-link" href="plan.html">Plan Trip</a>
            </div>

        </div>
    </nav>

    <!-- Hero / Main Section with Background Image -->
    <section class="hero-section text-center py-4">
        <div class="container">

            <h1 class="fw-bold text-primary mb-1">Discover Your Next Destination</h1>
            <p class="text-muted mb-5">Explore places, plan trips, and get recommendations.</p>

            <!-- Destination Cards Grid Overlapping the Background -->
            <div class="row justify-content-center g-4">

                <!-- Paris Card -->
                <div class="col-md-3">
                    <div class="card shadow border-0 text-start">
                        <img src="images/paris.jpg" class="card-img-top" alt="Paris">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Paris</h5>
                            <p class="card-text text-muted small">The city of lights and romance.</p>
                        </div>
                    </div>
                </div>

                <!-- Tokyo Card -->
                <div class="col-md-3">
                    <div class="card shadow border-0 text-start">
                        <img src="images/tokyo.jpg" class="card-img-top" alt="Tokyo">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">Tokyo</h5>
                            <p class="card-text text-muted small">A blend of tradition and technology.</p>
                        </div>
                    </div>
                </div>

                <!-- New York Card -->
                <div class="col-md-3">
                    <div class="card shadow border-0 text-start">
                        <img src="images/newyork.jpg" class="card-img-top" alt="New York">
                        <div class="card-body">
                            <h5 class="card-title fw-bold">New York</h5>
                            <p class="card-text text-muted small">The city that never sleeps.</p>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </section>

    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
<footer class="bg-dark text-white text-center p-4">

        <p class="mb-0">
            &copy; Joseph Evans Travel Assistant
        </p>
    </footer>

</html>
