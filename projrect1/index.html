<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-K Learning</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <main class="loading-screen" aria-live="polite">
        <div class="brand">
            <div class="mini">Welcome to</div>
            <h1>Joe P<span>-K</span> Learning</h1>
        </div>

        <div class="status">
            <div class="loading-text">A playful learning adventure</div>
            <div class="hint">Explore animals, colors, and numbers!!</div>
        </div>

        <div class="topics">
            <div class="topic animals-topic">
                <div>
                <img class="topic-image" src="images/cool.jpg" alt="Cool animal picture">
                <p>Animals</p>
                <a class="subject-btn" href="animals/animals.html" aria-label="Open Animals lesson">Play</a>
                </div>
            </div>
            <div class="topic">
                <div>
                <img class="topic-image" src="images/colors.jpg" alt="Cool animal picture">
                <p>Colors</p>
                <a class="subject-btn" href="colors/color.html" aria-label="Open Animals lesson">Play</a>
                </div>
            </div>
            <div class="topic">
                <div>
                <img class="topic-image" src="images/numbers.jpg" alt="Cool animal picture">
                <p>Numbers</p>
                <a class="subject-btn" href="numbers/num.html" aria-label="Open Animals lesson">Play</a>
                </div>
                
            </div>
            <div class="topic">
                <div>
                <img class="topic-image" src="images/shapes.jpg" alt="Shapes">
                <p>Shapes</p>
                <a class="subject-btn" href="shapes/shapes.html" aria-label="Open Shapes lesson">Play</a>
                </div>
            </div>
        </div>
    </main>
    <footer>
	<p>&copy; 2026 Joseph Evans. All rights reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
