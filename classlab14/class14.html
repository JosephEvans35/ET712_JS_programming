<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classlab 14</title>
    <link rel="stylesheet" href="styleclass14.css">
</head>
<body>
      <h1>Joseph Evans</h1>
    <h2>Window Events</h2>
    <section class="maincontainer">
        <div class="gallerycontainer"> 
            <img class= "galleryimage" src="images/summer.jpg" alt="summer">
            <img class= "galleryimage" src="images/fall.jpg" alt="fall">
            <img class= "galleryimage" src="images/winter.jpg" alt="winter">
            <img class= "galleryimage" src="images/spring.jpg" alt="spring">
        </div>

        <button class="btnright">&#x276F;</button>
        <button class="btnleft">&#x276E;</button>
    </section>
    
    <h2>Form Events</h2>
    <form id="myForm">
        <div class="formsession"> 
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" placeholder="Type username...">
        </div>

        <div class="formsession">
         <label for="password">Password: </label>
          <input type="text" id="password" placeholder="Enter a Password...">
          <p class="passwordmsg">Password must be at least 8 characters</p>
          <div id="passwordError">Error</div>
        </div>

        <button type="submit" class="sumitbtn">Submit</button>
    </form>

    <div class="msg">
        <p>Welcome</p>

    </div>

    <script src="scriptclass14.js"></script>
</body>
</html>
